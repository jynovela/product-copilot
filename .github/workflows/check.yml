name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The scripts use only the standard library, so the runner's own
      # Python is enough. They support Python 3.9 and newer.
      - name: Check the wiki and playbook
        run: |
          python3 --version
          python3 tools/lint_wiki.py
      - name: Test the check script and the raw-file guard
        run: |
          python3 tools/test_lint_wiki.py
          python3 tools/test_guard_raw.py
      - name: Test the skill scripts
        run: |
          python3 skills/humanize-check/test_check.py
          python3 skills/morning-brief/test_due.py
      - name: Build the seeded sample company and check it
        run: |
          ./examples/sample-company/setup.sh --seeded "$RUNNER_TEMP/crewline-test"
          cd "$RUNNER_TEMP/crewline-test"
          python3 tools/lint_wiki.py
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"
